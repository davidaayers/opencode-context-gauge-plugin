name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to republish, for example v0.1.2
        required: true
        type: string
      version:
        description: Package version matching the tag, for example 0.1.2
        required: true
        type: string
      sha:
        description: Commit SHA pointed to by the release tag
        required: true
        type: string

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['.--release_created'] || 'false' }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] }}
      version: ${{ steps.release.outputs['.--version'] }}
      sha: ${{ steps.release.outputs['.--sha'] }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}

  republish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag_name: ${{ inputs.tag_name }}
      version: ${{ inputs.version }}
      sha: ${{ inputs.sha }}
