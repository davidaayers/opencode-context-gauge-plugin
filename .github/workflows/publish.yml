name: Publish Package

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string
      version:
        description: Package version to publish
        required: true
        type: string
      sha:
        description: Expected commit for the release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$TAG_NAME" >&2
            exit 1
          fi
          if [[ "${TAG_NAME#v}" != "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag and version do not match.\n' >&2
            exit 1
          fi
          if [[ "$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]]; then
            printf 'Release is missing or still a draft: %s\n' "$TAG_NAME" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Verify release contents
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid release commit SHA.\n' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            printf 'Release tag does not point to the expected commit.\n' >&2
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const expected = process.env.EXPECTED_VERSION;
            if (packageJson.name !== "@davidaayers/opencode-context-gauge-plugin" || packageJson.version !== expected) {
              throw new Error(`Unexpected package identity: ${packageJson.name}@${packageJson.version}`);
            }
          '

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Check npm registry
        id: registry
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/npm-view-output"
          error_file="$RUNNER_TEMP/npm-view-error"
          set +e
          npm view "@davidaayers/opencode-context-gauge-plugin@$EXPECTED_VERSION" version --registry=https://registry.npmjs.org >"$output_file" 2>"$error_file"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            printf 'Version is already published; nothing to do.\n'
            printf 'already_published=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(<"$error_file")" != *E404* ]]; then
            printf 'Unable to determine whether the npm version exists:\n' >&2
            cat "$error_file" >&2
            exit "$status"
          fi

      - name: Publish to npm
        if: ${{ steps.registry.outputs.already_published != 'true' }}
        run: npm publish --provenance --access public
